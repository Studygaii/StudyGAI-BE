apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  namespace: studygai
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
    - name: grpc
      port: 6334
    - name: p2p
      port: 6335
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: studygai
spec:
  serviceName: qdrant-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6333"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: qdrant
              topologyKey: topology.kubernetes.io/zone
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
            - name: p2p
              containerPort: 6335
          env:
            - name: QDRANT__CLUSTER__ENABLED
              value: "true"
            - name: QDRANT__STORAGE__ON_DISK_PAYLOAD
              value: "true"
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: studygai-secrets
                  key: QDRANT_API_KEY
          command:
            - /bin/sh
            - -c
            - |
              if [ "$HOSTNAME" = "qdrant-0" ]; then
                exec ./qdrant --uri "http://${HOSTNAME}.qdrant-headless.studygai.svc.cluster.local:6335"
              else
                exec ./qdrant --bootstrap "http://qdrant-0.qdrant-headless.studygai.svc.cluster.local:6335" --uri "http://${HOSTNAME}.qdrant-headless.studygai.svc.cluster.local:6335"
              fi
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
            limits:
              cpu: "8000m"
              memory: "32Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 6333
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        # Use local NVMe / gp3 / pd-ssd storage class in production for fast binary-quant rescoring
        storageClassName: fast-nvme
        resources:
          requests:
            storage: 500Gi
