apiVersion: v1
kind: Namespace
metadata:
  name: studygai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studygai-config
  namespace: studygai
data:
  NODE_ENV: "production"
  PORT: "4000"
  # Horizontal WebSockets & Async Ingestion
  ENABLE_REDIS_WS_ADAPTER: "true"
  ENABLE_BULLMQ: "true"
  INGESTION_CONCURRENCY: "8"
  # 100M-User Qdrant Cluster Configuration (1-bit Binary Quantization = 32x RAM savings + Custom Shard Keys)
  QDRANT_URL: "http://qdrant-headless.studygai.svc.cluster.local:6333"
  QDRANT_COLLECTION: "source_chunks"
  QDRANT_QUANTIZATION: "binary"
  QDRANT_SHARDING_MODE: "custom"
  QDRANT_SHARD_COUNT: "32"
  QDRANT_REPLICATION_FACTOR: "2"
  # GPU Production Embedding & Reranker Profile (BGE-M3 1024d + bge-reranker-v2-m3)
  RAG_PROFILE: "gpu"
  VECTOR_DIM: "1024"
  EMBEDDING_MODEL: "BAAI/bge-m3"
  RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  RAG_WORKER_URL: "http://rag-worker-gpu.studygai.svc.cluster.local:5000"
  # Object Storage (AWS S3 or Cloudflare R2 — zero egress fees recommended)
  STORAGE_DRIVER: "s3"
  S3_REGION: "auto"
  S3_BUCKET: "studygai-prod-sources"
  S3_FORCE_PATH_STYLE: "false"
  # Hot -> Cold Vector Tiering
  VECTOR_COLD_AFTER_DAYS: "30"
  # Tiered Distributed Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_CHAT_RPM: "60"
  RATE_LIMIT_INGEST_RPM: "30"
  RATE_LIMIT_STUDIO_RPM: "20"
  RATE_LIMIT_GLOBAL_RPM: "300"
  # Multi-LLM Routing (Groq fast RAG + Gemini 1M-token long-context synthesis)
  LLM_PROVIDER: "groq"
  GROQ_MODEL: "llama-3.3-70b-versatile"
  GEMINI_MODEL: "gemini-2.5-flash"
---
# Template — replace values via ExternalSecrets / Vault / SealedSecrets before applying
apiVersion: v1
kind: Secret
metadata:
  name: studygai-secrets
  namespace: studygai
type: Opaque
stringData:
  mongoURI: "mongodb+srv://user:pass@cluster.mongodb.net/studygai-prod"
  REDIS_URL: "redis://:password@redis-cluster.studygai.svc.cluster.local:6379"
  JWTKey: "CHANGE_ME_256_BIT_SECRET"
  QDRANT_API_KEY: "CHANGE_ME_QDRANT_KEY"
  GROQ_API_KEY: "CHANGE_ME_GROQ_KEY"
  GEMINI_API_KEY: "CHANGE_ME_GEMINI_KEY"
  S3_ENDPOINT: "https://<account-id>.r2.cloudflarestorage.com"
  S3_ACCESS_KEY_ID: "CHANGE_ME_S3_ACCESS"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME_S3_SECRET"
  OPS_ADMIN_TOKEN: "CHANGE_ME_OPS_TOKEN"
  METRICS_BEARER_TOKEN: "CHANGE_ME_METRICS_TOKEN"
