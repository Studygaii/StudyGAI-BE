# ==============================================================================
# Split Parser / Embedding / Reranker Worker Fleets for 100M+ Scale Cost Efficiency
# 1. CPU Fast-Path Fleet: Handles ~80% of clean digital PDFs, web scraping & YouTube
# 2. GPU Heavy Fleet: Handles BGE-M3 dense+sparse, bge-reranker-v2-m3, Docling & OCR
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker-cpu
  namespace: studygai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-worker-cpu
  template:
    metadata:
      labels:
        app: rag-worker-cpu
    spec:
      containers:
        - name: rag-worker
          image: ghcr.io/studygaii/studygai-rag-worker:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: studygai-config
            - secretRef:
                name: studygai-secrets
          env:
            - name: RAG_PROFILE
              value: "cpu"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "6Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-worker-cpu-hpa
  namespace: studygai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-worker-cpu
  minReplicas: 2
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker-gpu
  namespace: studygai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-worker-gpu
  template:
    metadata:
      labels:
        app: rag-worker-gpu
    spec:
      nodeSelector:
        accelerator: nvidia-l4
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: rag-worker-gpu
          image: ghcr.io/studygaii/studygai-rag-worker:gpu-latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: studygai-config
            - secretRef:
                name: studygai-secrets
          env:
            - name: RAG_PROFILE
              value: "gpu"
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "6000m"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rag-worker-gpu
  namespace: studygai
spec:
  selector:
    app: rag-worker-gpu
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-worker-gpu-hpa
  namespace: studygai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-worker-gpu
  minReplicas: 2
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
