apiVersion: apps/v1
kind: Deployment
metadata:
  name: studygai-api
  namespace: studygai
  labels:
    app: studygai-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: studygai-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: studygai-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 45
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: studygai-api
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: api
          image: ghcr.io/studygaii/studygai-be:latest
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: studygai-config
            - secretRef:
                name: studygai-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2560Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: studygai-api
  namespace: studygai
spec:
  selector:
    app: studygai-api
  ports:
    - name: http
      port: 80
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: studygai-api-hpa
  namespace: studygai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: studygai-api
  minReplicas: 3
  maxReplicas: 200
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: studygai-api-pdb
  namespace: studygai
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: studygai-api
